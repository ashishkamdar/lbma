name: Fetch LBMA London Fix
on:
  # London fix auctions (BST):
  #   AM gold ~09:30 UTC, PM gold ~14:00 UTC.
  # LBMA's static JSON can lag the auction by 1-2 hours (observed
  # 2026-05-11: PM auction at 14:00 UTC, JSON still at May 8 by 15:40 UTC).
  # We sweep multiple times across the day so a slow LBMA refresh doesn't
  # leave the page a full day stale. All runs are on GitHub-hosted runners
  # (free, unlimited for public repos) -- no load on our origin server.
  schedule:
    - cron: '5 10 * * 1-5'   # 10:05 UTC -- AM fix
    - cron: '5 11 * * 1-5'   # 11:05 UTC -- AM retry
    - cron: '35 14 * * 1-5'  # 14:35 UTC -- PM fix
    - cron: '35 15 * * 1-5'  # 15:35 UTC -- PM retry
    - cron: '35 17 * * 1-5'  # 17:35 UTC -- PM late retry (LBMA slow days)
    - cron: '35 19 * * 1-5'  # 19:35 UTC -- final daily attempt
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lbma-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch latest LBMA fix
        run: python scripts/fetch_lbma.py
      - name: Show output
        run: cat london-fix.json
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain london-fix.json)" ]]; then
            FIX_DATE=$(jq -r .latest_fix_date london-fix.json)
            git add london-fix.json
            git commit -m "fix: $FIX_DATE"
            git push
          else
            echo "no change"
          fi
